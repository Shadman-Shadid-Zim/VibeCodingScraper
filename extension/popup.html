<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; background: #0f0f23; color: #e2e8f0; font: 13px/1.5 'Segoe UI', Arial, sans-serif; }
  .wrap { padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 2px; color: #a5b4fc; display: flex; align-items: center; gap: 8px; }
  .sub { color: #64748b; font-size: 11px; margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #94a3b8; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: #1a1a3e; border: 1px solid #312e81; color: #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; }
  input:focus { border-color: #6366f1; }
  button { width: 100%; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  .primary { background: #6366f1; color: #fff; }
  .danger  { background: #ef4444; color: #fff; }
  .ghost   { background: transparent; color: #94a3b8; border: 1px solid #312e81; }
  .msg { margin-top: 10px; font-size: 12px; border-radius: 8px; padding: 8px 10px; display: none; }
  .msg.err { display: block; background: #2d1215; color: #fca5a5; }
  .msg.ok  { display: block; background: #0a1a0a; color: #86efac; }
  .status { display: flex; align-items: center; gap: 8px; background: #1a1a3e; border: 1px solid #312e81; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
  .dot.rec { background: #ef4444; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  .count { margin-left: auto; color: #6366f1; font-weight: 700; }
  details { margin-top: 10px; }
  summary { color: #64748b; font-size: 11px; cursor: pointer; }
  .userline { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .userline b { color: #e2e8f0; }
  a { color: #818cf8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ Shadman's API Recorder</h1>
  <div class="sub">Record any website → turn it into an API</div>

  <div id="login-view" style="display:none">
    <label>Platform URL</label>
    <input id="server-url" placeholder="http://localhost:3000">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••">
    <button class="primary" id="login-btn">Sign In</button>
    <details>
      <summary>Signed up with Google? Use a token instead</summary>
      <label>Paste your token</label>
      <input id="token-input" placeholder="paste token from the website">
      <button class="ghost" id="token-btn">Save Token</button>
    </details>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="main-view" style="display:none">
    <div class="userline">Signed in as <b id="user-name"></b> · <a href="#" id="logout">sign out</a></div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Not recording</span>
      <span class="count" id="count"></span>
    </div>
    <button class="primary" id="start-btn">🎙️ Start Recording This Tab</button>
    <button class="danger" id="stop-btn" style="display:none">⏹ Stop &amp; Upload</button>
    <button class="ghost" id="dash-btn">Open Dashboard</button>
    <div class="msg" id="main-msg"></div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
